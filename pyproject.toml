[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaplist"
version = "0.1.0"
description = "Read and analyse Google Maps shared place lists, including per-entry contributor and timestamp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
gmaplist = "gmaplist.cli:main"

[tool.setuptools]
packages = ["gmaplist"]
