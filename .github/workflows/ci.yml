name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Pinned in requirements-dev.txt so this job and a local checkout agree
      # byte for byte.
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is offline: every fixture is inline, so no request reaches
      # Google and no list id is needed to run it.
      - run: python -m unittest discover -s tests -v

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build
      - run: python -m build
      - run: python -m pip install --quiet dist/*.whl
      # "No runtime dependencies" is a promise the README makes. Guard it,
      # rather than trusting that nobody adds one by accident.
      - name: Assert the installed package pulls in nothing
        run: |
          python - <<'EOF'
          import importlib.metadata as md
          requires = md.requires("gmaplist") or []
          assert not requires, f"unexpected runtime dependencies: {requires}"
          print("no runtime dependencies")
          EOF
      - name: Smoke the console script from outside the source tree
        run: cd /tmp && gmaplist --help
