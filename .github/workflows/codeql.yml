name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 08:00 UTC, an hour after the Dependabot run.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e  # v2.26.4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e  # v2.26.4
